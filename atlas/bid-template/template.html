<table role="presentation" width="660" cellpadding="0" cellspacing="0" border="0" style="width:660px;table-layout:fixed;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
<tr>
<td width="280" valign="top" bgcolor="#000000" style="background-color:#000000;padding:0;border-left:4px solid #caa660;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;border-collapse:collapse;">
<tr><td style="padding:24px 22px 10px;font-size:10px;line-height:15px;letter-spacing:2px;color:#cfb47c;">OUR OFFER</td></tr>
<tr><td style="padding:0 22px 26px;font-family:Georgia,'Times New Roman',serif;font-size:32px;line-height:39px;color:#efd59a;overflow-wrap:anywhere;word-wrap:break-word;">${brokerPrice}</td></tr>
<tr><td style="padding:0 22px 24px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;border-collapse:collapse;">
<tr><td bgcolor="#812b3b" style="padding:12px 14px;background-color:#812b3b;font-size:11px;line-height:17px;color:#efd59a;">MC#<br><strong style="font-size:20px;line-height:28px;color:#ffffff;overflow-wrap:anywhere;word-wrap:break-word;">{MCNumber}</strong></td></tr>
</table>
</td></tr>
</table>
</td>
<td width="376" valign="top" bgcolor="#ffffff" style="background-color:#ffffff;padding:0;border-top:1px solid #e7e0d4;border-right:1px solid #e7e0d4;border-bottom:1px solid #e7e0d4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;border-collapse:collapse;">
<tr>
<td width="50%" valign="top" style="padding:24px 12px 22px 24px;overflow-wrap:anywhere;word-wrap:break-word;">
<div style="font-size:11px;line-height:17px;color:#746044;">Truck location</div>
<div style="padding-top:8px;font-size:18px;line-height:25px;font-weight:bold;color:#201d1b;">{miles} <span style="font-size:12px;line-height:18px;font-weight:normal;">miles out</span></div>
</td>
<td width="50%" valign="top" style="padding:24px 20px 22px 12px;overflow-wrap:anywhere;word-wrap:break-word;">
<div style="font-size:11px;line-height:17px;color:#746044;">Dimensions</div>
<div style="padding-top:8px;font-size:18px;line-height:25px;font-weight:bold;color:#201d1b;">{dims} <span style="font-size:12px;font-weight:normal;">in</span></div>
</td>
</tr>
<tr>
<td valign="top" style="padding:0 12px 24px 24px;overflow-wrap:anywhere;word-wrap:break-word;">
<div style="font-size:11px;line-height:17px;color:#746044;">Estimated arrival</div>
<div style="padding-top:8px;font-size:18px;line-height:25px;font-weight:bold;color:#812b3b;">{eta}</div>
<div style="padding-top:5px;font-size:10px;line-height:16px;color:#746044;">According to Google</div>
</td>
<td valign="top" style="padding:0 20px 24px 12px;overflow-wrap:anywhere;word-wrap:break-word;">
<div style="font-size:11px;line-height:17px;color:#746044;">Payload</div>
<div style="padding-top:8px;font-size:18px;line-height:25px;font-weight:bold;color:#201d1b;">{payload} <span style="font-size:12px;font-weight:normal;">lbs</span></div>
</td>
</tr>
</table>
</td>
</tr>
<tr><td colspan="2" style="padding:12px 0 18px;font-size:11px;line-height:17px;color:#655c50;">ALL BIDS ARE VALID 15 MINS</td></tr>
</table>
