<table role="presentation" width="660" cellpadding="0" cellspacing="0" border="0" style="width:660px;table-layout:fixed;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
<tr><td bgcolor="#111111" style="padding:24px;background-color:#111111;border-bottom:4px solid #812b3b;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;border-collapse:collapse;">
<tr>
<td width="62%" valign="top" style="padding-right:24px;overflow-wrap:anywhere;word-wrap:break-word;">
<div style="font-size:11px;line-height:17px;letter-spacing:2px;color:#d0d0d0;">OUR OFFER</div>
<div style="padding-top:8px;font-size:36px;line-height:44px;font-weight:bold;color:#ffffff;">${brokerPrice}</div>
</td>
<td width="38%" valign="middle" style="padding-left:24px;border-left:1px solid #555555;overflow-wrap:anywhere;word-wrap:break-word;">
<div style="font-size:11px;line-height:17px;letter-spacing:1px;color:#d0d0d0;">MC#</div>
<div style="padding-top:8px;font-size:24px;line-height:32px;font-weight:bold;color:#ffffff;">{MCNumber}</div>
</td>
</tr></table>
</td></tr>
<tr><td bgcolor="#ffffff" style="padding:4px 24px 8px;background-color:#ffffff;border-left:1px solid #e4e4e4;border-right:1px solid #e4e4e4;border-bottom:1px solid #e4e4e4;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;border-collapse:collapse;">
<tr>
<td width="50%" valign="top" style="padding:20px 24px 20px 0;border-bottom:1px solid #e4e4e4;overflow-wrap:anywhere;word-wrap:break-word;">
<div style="font-size:12px;line-height:18px;color:#666666;">Truck location</div>
<div style="padding-top:6px;font-size:20px;line-height:28px;font-weight:bold;color:#171717;">{miles} <span style="font-size:14px;font-weight:normal;">miles out</span></div>
</td>
<td width="50%" valign="top" style="padding:20px 0 20px 24px;border-bottom:1px solid #e4e4e4;overflow-wrap:anywhere;word-wrap:break-word;">
<div style="font-size:12px;line-height:18px;color:#666666;">Dimensions</div>
<div style="padding-top:6px;font-size:20px;line-height:28px;font-weight:bold;color:#171717;">{dims} <span style="font-size:14px;font-weight:normal;">in</span></div>
</td>
</tr>
<tr>
<td valign="top" style="padding:20px 24px 20px 0;overflow-wrap:anywhere;word-wrap:break-word;">
<div style="font-size:12px;line-height:18px;color:#666666;">Estimated arrival</div>
<div style="padding-top:6px;font-size:20px;line-height:28px;font-weight:bold;color:#812b3b;">{eta}</div>
<div style="padding-top:4px;font-size:11px;line-height:17px;color:#666666;">According to Google</div>
</td>
<td valign="top" style="padding:20px 0 20px 24px;overflow-wrap:anywhere;word-wrap:break-word;">
<div style="font-size:12px;line-height:18px;color:#666666;">Payload</div>
<div style="padding-top:6px;font-size:20px;line-height:28px;font-weight:bold;color:#171717;">{payload} <span style="font-size:14px;font-weight:normal;">lbs</span></div>
</td>
</tr></table>
</td></tr>
<tr><td style="padding:16px 0 20px;font-size:16px;line-height:23px;font-weight:bold;color:#b42332;">ALL BIDS ARE VALID 15 MINS</td></tr>
</table>
[sign]
