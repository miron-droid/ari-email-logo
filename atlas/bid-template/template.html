<table role="presentation" width="660" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:660px;table-layout:fixed;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td width="33.333%" valign="top" bgcolor="#000000" style="background-color:#000000;border-top:3px solid #caa660;padding:0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;border-collapse:collapse;">
        <tr><td style="padding:24px 20px 8px;font-size:10px;line-height:15px;letter-spacing:2px;color:#cfb47c;">OUR RATE</td></tr>
        <tr><td style="padding:0 20px 24px;font-size:36px;line-height:42px;font-weight:bold;color:#efd59a;overflow-wrap:anywhere;word-wrap:break-word;word-break:break-all;">${brokerPrice}</td></tr>
        <tr><td style="padding:0 20px 24px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;border-collapse:collapse;">
            <tr><td style="border-top:1px solid #caa660;padding-top:14px;font-size:11px;line-height:17px;letter-spacing:1px;color:#cfb47c;">MC#</td></tr>
            <tr><td style="padding-top:4px;font-size:24px;line-height:30px;font-weight:bold;color:#ffffff;overflow-wrap:anywhere;word-wrap:break-word;word-break:break-all;">{MCNumber}</td></tr>
          </table>
        </td></tr>
      </table>
    </td>
    <td width="66.667%" valign="top" bgcolor="#ffffff" style="background-color:#ffffff;border-top:3px solid #caa660;border-right:1px solid #e7e0d4;padding:0;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;border-collapse:collapse;">
        <tr>
          <td width="50%" valign="top" style="padding:24px 18px 20px 26px;border-right:1px solid #e7e0d4;border-bottom:1px solid #e7e0d4;overflow-wrap:anywhere;word-wrap:break-word;">
            <div style="font-size:11px;line-height:17px;color:#746044;">Truck location</div>
            <div style="padding-top:7px;font-size:18px;line-height:25px;font-weight:bold;color:#201d1b;word-break:break-all;">{miles} <span style="font-size:12px;font-weight:normal;word-break:normal;">miles out</span></div>
          </td>
          <td width="50%" valign="top" style="padding:24px 18px 20px;border-bottom:1px solid #e7e0d4;overflow-wrap:anywhere;word-wrap:break-word;">
            <div style="font-size:11px;line-height:17px;color:#746044;">Dimensions</div>
            <div style="padding-top:7px;font-size:18px;line-height:25px;font-weight:bold;color:#201d1b;word-break:break-all;">{dims} <span style="font-size:12px;font-weight:normal;">in</span></div>
          </td>
        </tr>
        <tr>
          <td valign="top" style="padding:19px 18px 22px 26px;border-right:1px solid #e7e0d4;overflow-wrap:anywhere;word-wrap:break-word;">
            <div style="font-size:11px;line-height:17px;color:#746044;">Estimated arrival</div>
            <div style="padding-top:7px;font-size:18px;line-height:25px;font-weight:bold;color:#812b3b;">{eta}</div>
            <div style="padding-top:4px;font-size:11px;line-height:17px;color:#746044;">According to Google</div>
          </td>
          <td valign="top" style="padding:19px 18px 22px;overflow-wrap:anywhere;word-wrap:break-word;">
            <div style="font-size:11px;line-height:17px;color:#746044;">Payload</div>
            <div style="padding-top:7px;font-size:18px;line-height:25px;font-weight:bold;color:#201d1b;word-break:break-all;">{payload} <span style="font-size:12px;font-weight:normal;">lbs</span></div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <tr><td colspan="2" bgcolor="#812b3b" style="height:4px;font-size:1px;line-height:4px;background-color:#812b3b;">&nbsp;</td></tr>
  <tr><td colspan="2" style="padding:12px 0 18px;font-size:11px;line-height:17px;color:#655c50;">ALL BIDS ARE VALID 15 MINS</td></tr>
</table>
[sign]
