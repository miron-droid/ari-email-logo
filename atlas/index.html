<script>
const base=document.getElementById('source').textContent;const sig=document.getElementById('signature'),code=document.getElementById('code'),status=document.getElementById('status');let html=base;
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function update(){const n=document.getElementById('name').value.trim(),r=document.getElementById('role').value.trim(),e=document.getElementById('email').value.trim()||'atlasbridgefreight@gmail.com',p=document.getElementById('phone').value.trim()||'+1 (234) 231-6444';html=base.replace('Dispatch Team</div>',esc(n||'Dispatch Team')+'</div>').replace('Atlas Bridge Freight</div>',esc(r||'Atlas Bridge Freight')+'</div>').replaceAll('atlasbridgefreight@gmail.com',esc(e)).replace('+1 (234) 231-6444</a>',esc(p)+'</a>').replace('tel:+12342316444','tel:'+p.replace(/[^+0-9]/g,''));sig.innerHTML=html;code.value=html;status.textContent='';}
document.querySelectorAll('input').forEach(x=>x.addEventListener('input',update));
document.getElementById('copy').onclick=async()=>{if(!document.getElementById('email').reportValidity())return;try{await navigator.clipboard.writeText(html);status.textContent='HTML скопирован.';}catch(e){document.querySelector('details').open=true;code.select();status.textContent=document.execCommand('copy')?'HTML скопирован.':'Нажмите Ctrl+C или ⌘C.';}};
document.getElementById('visual').onclick=async()=>{if(!document.getElementById('email').reportValidity())return;try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([sig.innerText],{type:'text/plain'})})]);status.textContent='Подпись скопирована.';}catch(e){const r=document.createRange();r.selectNodeContents(sig);const s=window.getSelection();s.removeAllRanges();s.addRange(r);status.textContent=document.execCommand('copy')?'Подпись скопирована.':'Нажмите Ctrl+C или ⌘C.';}};
update();</script></main></body></html>
