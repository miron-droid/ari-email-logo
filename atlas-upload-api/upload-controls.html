<div class="photo-upload" style="margin:16px 0;padding:16px;border:1px solid #d7cbbc;border-radius:6px;">
<label>Team upload code<input id="upload-code" type="password" autocomplete="off" placeholder="Provided by your administrator"></label>
<label style="display:block;margin-top:10px;">Upload your photo<input id="upload-file" type="file" accept="image/jpeg,image/png,image/webp"></label>
<p class="photo-help">Your photo will be saved publicly on GitHub and inserted into your signature. JPEG, PNG or WebP, up to 15 MB.</p>
<p id="upload-status" role="status" aria-live="polite"></p></div>
